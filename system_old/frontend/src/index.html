<!doctype html>
<html lang="en">
    <head>
        <title>MEINHARDT E-Form - MEINHARDT Electronic Form Management System</title>
        <meta charset="utf-8" />
        <meta
            name="description"
            content="MEINHARDT Electronic Form Management System - Electronic Document Management System for MEINHARDT Company"
        />
        <meta
            name="keywords"
            content="MEINHARDT,MEINHARDT E-Form,Electronic Form,Form Management,Document Management,Angular,Material Design,TailwindCSS"
        />
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0"
        />

        <base href="/" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
        <link rel="apple-touch-icon" sizes="32x32" href="favicon-32x32.png" />

        <!-- Fonts -->
        <link href="https://fonts.gstatic.com" rel="preconnect" />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
            rel="stylesheet"
        />

        <!-- Icon fonts -->
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet"
        />
    </head>

    <body>
        <!-- Splash screen -->
        <fuse-splash-screen>
            <img src="images/logo/logo-meinharde.png" alt="MEINHARDT Logo" />
            <div class="spinner">
                <div class="bounce1"></div>
                <div class="bounce2"></div>
                <div class="bounce3"></div>
            </div>
        </fuse-splash-screen>

        <!-- App root -->
        <app-root></app-root>
    </body>
</html>

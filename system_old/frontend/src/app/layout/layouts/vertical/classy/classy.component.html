<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Main Container -->
<div class="flex h-screen w-full overflow-hidden bg-gray-50">
    <!-- Navigation -->
    <fuse-vertical-navigation
        class="dark flex-shrink-0 bg-gray-900 print:hidden"
        [class.legacy-sidebar-active]="useLegacyCategoryTitles"
        [mode]="isScreenSmall ? 'over' : 'side'"
        [name]="'mainNavigation'"
        [navigation]="navigation.default"
        [opened]="!isScreenSmall"
    >
        <!-- Navigation header hook -->
        <ng-container fuseVerticalNavigationContentHeader>
            <div class="flex w-full items-center p-4 pl-6">
                <!-- Logo -->
                <div class="flex h-10 items-center justify-center">
                    <img
                        class="h-10 w-36 object-contain object-left"
                        src="images/logo/meinhardt-group-logo-white.png"
                        alt="Meinhardt Group Logo"
                    />
                </div>
                <!-- Components -->
                <div class="ml-auto flex items-center">
                    <user [showAvatar]="false"></user>
                </div>
            </div>
            <!-- User -->
            <div class="flex w-full flex-col items-center p-4">
                <div class="relative h-24 w-24">
                    @if (user?.avatar) {
                        <img
                            class="h-full w-full rounded-full"
                            [src]="user.avatar"
                            alt="User avatar"
                        />
                    }
                    @if (!user?.avatar) {
                        <mat-icon
                            class="icon-size-24"
                            [svgIcon]="'heroicons_solid:user-circle'"
                        ></mat-icon>
                    }
                </div>
                <div
                    class="mt-6 flex w-full flex-col items-center justify-center"
                >
                    <div
                        class="w-full overflow-hidden text-ellipsis whitespace-nowrap text-center font-medium leading-normal"
                    >
                        {{ sidebarUserName }}
                    </div>
                    <div
                        class="text-secondary mt-0.5 w-full overflow-hidden text-ellipsis whitespace-nowrap text-center text-md font-medium leading-normal"
                    >
                        {{ user?.email }}
                    </div>
                    <div
                        class="mt-1 w-full overflow-hidden text-ellipsis whitespace-nowrap text-center text-xs text-gray-400"
                    >
                        {{ user?.role }}
                    </div>
                </div>
                <div class="mt-4 w-full px-2">
                    <div
                        class="flex items-center justify-between rounded-md bg-white/5 px-3 py-2"
                    >
                        <div class="min-w-0">
                            <div
                                class="truncate text-sm font-medium text-gray-200"
                            >
                                Menu Styles
                            </div>
                            <div class="truncate text-xs text-gray-400">
                                {{
                                    useLegacyCategoryTitles ? 'Legacy' : 'Codes'
                                }}
                            </div>
                        </div>
                        <button
                            type="button"
                            class="legacy-menu-title-switch"
                            [class.legacy-menu-title-switch--checked]="
                                useLegacyCategoryTitles
                            "
                            [attr.aria-checked]="
                                useLegacyCategoryTitles ? 'true' : 'false'
                            "
                            aria-label="Toggle old menu names"
                            role="switch"
                            (click)="toggleLegacyCategoryTitles()"
                        >
                            <span
                                class="legacy-menu-title-switch__thumb"
                                aria-hidden="true"
                            ></span>
                        </button>
                    </div>
                </div>
            </div>
        </ng-container>
        <!-- Navigation footer hook - Removed FUSE logo -->
        <ng-container fuseVerticalNavigationContentFooter>
            <!-- FUSE logo removed -->
        </ng-container>
    </fuse-vertical-navigation>

    <!-- Wrapper -->
    <div
        class="flex h-full w-full min-w-0 flex-1 flex-col overflow-y-auto overflow-x-hidden"
    >
        <!-- Header -->
        <div
            class="bg-card relative z-49 flex h-16 w-full flex-0 items-center px-4 shadow md:px-6 dark:border-b dark:bg-transparent dark:shadow-none print:hidden"
        >
            <!-- Navigation toggle button -->
            <button
                mat-icon-button
                (click)="toggleNavigation('mainNavigation')"
            >
                <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
            </button>
            <!-- Components -->
            <div
                class="ml-auto flex items-center space-x-0.5 pl-2 sm:space-x-2"
            >
                <page-manual-help></page-manual-help>
                <!-- Search, Shortcuts, Messages buttons removed -->
            </div>
        </div>

        <!-- Content -->
        <div
            class="flex w-full flex-1 flex-col overflow-y-auto overflow-x-hidden bg-gray-50"
        >
            <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
             Otherwise, layout changes won't be registered and the view won't be updated! -->
            @if (true) {
                <div class="h-full w-full">
                    <router-outlet></router-outlet>
                </div>
            }
        </div>

        <!-- Footer -->
        <!--<div class="relative flex flex-0 items-center justify-start w-full h-14 px-4 md:px-6 z-49 border-t bg-card dark:bg-transparent print:hidden">
        <span class="font-medium text-secondary">Fuse &copy; {{currentYear}}</span>
    </div>-->
    </div>
</div>

<!-- Quick chat removed -->

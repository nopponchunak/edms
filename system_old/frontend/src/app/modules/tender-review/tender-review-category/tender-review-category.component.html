<div class="h-full bg-gray-50">
  <div class="bg-white shadow-sm border-b border-gray-200 w-full">
    <div class="w-full px-6 py-4">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">Tender Review</h1>
        <p class="text-base text-gray-600 mt-1">CSA and MEP tender review workflows</p>
      </div>
    </div>
  </div>

  <div class="w-full px-6 py-6">
    <div *ngIf="visibleOptions.length; else noTenderAccess" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      <div
        *ngFor="let option of visibleOptions"
        class="tender-option bg-white border border-gray-200 shadow-sm hover:shadow-md transition-all duration-200"
        [ngClass]="option.accent"
      >
        <button type="button" class="tender-option__main" (click)="open(option.link)">
          <span class="tender-option__icon">
            <mat-icon>{{ option.icon }}</mat-icon>
          </span>
          <span class="min-w-0">
            <span class="block text-lg font-semibold text-gray-900">{{ option.title }}</span>
            <span class="block text-sm text-gray-500 mt-1">{{ option.subtitle }}</span>
          </span>
        </button>

        <div class="tender-option__actions border-t border-gray-100">
          <button mat-stroked-button type="button" color="primary" (click)="open(option.link)">
            <mat-icon>folder_open</mat-icon>
            Open
          </button>
          <button
            *ngIf="canCreate(option)"
            mat-flat-button
            type="button"
            color="primary"
            (click)="open(option.newLink)"
          >
            <mat-icon>add</mat-icon>
            New
          </button>
        </div>
      </div>
    </div>

    <ng-template #noTenderAccess>
      <div class="bg-white border border-gray-200 rounded-lg p-10 text-center">
        <mat-icon class="text-gray-400 icon-size-12">lock</mat-icon>
        <h2 class="mt-4 text-xl font-semibold text-gray-900">No tender review access</h2>
        <p class="mt-2 text-sm text-gray-500">Your account does not have permission for Tender Review categories.</p>
      </div>
    </ng-template>
  </div>
</div>

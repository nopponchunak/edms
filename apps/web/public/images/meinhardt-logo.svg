      .meinhardt-text {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-weight: bold;
        font-size: 24px;
        letter-spacing: 0.5px;
      }
      .meinhardt-blue {
        fill: #1e3a8a;
      }
      .meinhardt-orange {

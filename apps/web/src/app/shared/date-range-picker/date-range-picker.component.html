<div class="drp" [class.drp-open]="open()" [class.drp-has-value]="hasValue()">
  <button class="drp-trigger" type="button" (click)="toggle()" aria-haspopup="dialog" [attr.aria-expanded]="open()">
    <span class="drp-value" [class.drp-placeholder]="!hasValue()">{{ label() || placeholder }}</span>
    <svg class="drp-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
  </button>

  @if (hasValue()) {
    <button class="drp-x" type="button" (click)="clear()" aria-label="Clear dates" title="Clear dates">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  }

  @if (open()) {
    <div class="drp-panel" role="dialog" aria-label="Choose a date range">
      <div class="drp-head">
        <button type="button" class="drp-nav" (click)="shiftMonth(-1)" aria-label="Previous month">‹</button>
        <strong>{{ title() }}</strong>
        <button type="button" class="drp-nav" (click)="shiftMonth(1)" aria-label="Next month">›</button>
      </div>
      <div class="drp-grid drp-weekdays">
        @for (day of weekdays; track day) { <span>{{ day }}</span> }
      </div>
      <div class="drp-grid" (mouseleave)="hover.set('')">
        @for (cell of cells(); track cell.iso) {
          <button type="button" class="drp-day"
            [class.drp-out]="!cell.inMonth"
            [class.drp-today]="cell.today"
            [class.drp-edge]="isEdge(cell.iso)"
            [class.drp-range]="inRange(cell.iso)"
            (mouseenter)="hover.set(cell.iso)"
            (click)="pick(cell.iso)">{{ cell.day }}</button>
        }
      </div>
      <p class="drp-hint">{{ !start() || end() ? 'Pick the start date' : 'Now pick the end date' }}</p>
      <div class="drp-foot">
        <button type="button" (click)="preset('today')">Today</button>
        <button type="button" (click)="preset('week')">Last 7 days</button>
        <button type="button" (click)="preset('month')">This month</button>
        <button type="button" class="drp-clear" (click)="clear()">Clear</button>
      </div>
    </div>
  }
</div>
